<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Claude Island 미리보기</title>
    <style>
      /* 개발용 미리보기 틀. 앱 빌드에는 들어가지 않는다. 맥북 화면 위쪽을 흉내 낸다. */
      html, body { margin: 0; height: 100%; }
      body {
        background: #FFFFFF;
        font: 13px/18px -apple-system, sans-serif;
      }
      .menubar { position: absolute; inset: 0 0 auto 0; height: 37px; background: #F2F2F7; }
      .stage { position: relative; width: 100%; height: 100%; }
      iframe { position: absolute; left: 50%; transform: translateX(-50%); border: 0; background: transparent; }
      #island { top: 0; width: 416px; height: 37px; }
      #pill { top: 45px; width: 204px; height: 34px; }
      #top { top: 0; width: 204px; height: 32px; }
      #panel { top: 45px; width: 440px; height: 680px; }
      #widget { top: 61px; right: 24px; left: auto; transform: none; width: 440px; height: 620px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="menubar"></div>
      <iframe id="island" title="island"></iframe>
      <iframe id="panel" title="panel"></iframe>
      <iframe id="widget" title="widget"></iframe>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const state = q.get('state') || 'ok';
      const mode = q.get('mode') || 'notch';
      const island = document.getElementById('island');
      if (mode === 'pill') island.id = 'pill';
      if (mode === 'top') island.id = 'top';
      island.src = `island.html?state=${state}&mode=${mode}`;
      const widget = document.getElementById('widget');
      if (q.get('widget') === '1') widget.src = `widget.html?state=${state}${q.get('move') === '1' ? '&move=1' : ''}`;
      else widget.remove();
      const panel = document.getElementById('panel');
      if (q.get('panel') === '0') panel.remove();
      else {
        panel.src = `panel.html?state=${state}&mode=${mode}`;
        if (mode === 'pill') panel.style.top = '87px';
      }
    </script>
  </body>
</html>
